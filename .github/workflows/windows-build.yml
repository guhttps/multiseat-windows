name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Validate diagnostic scripts and helpers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1' -Recurse) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($file.Name + ': ' + ($errors -join '; ')) }
          }
          Add-Type -Path scripts/RpcTraceFilter.cs
          Add-Type -Path scripts/RpcStackSymbols.cs
          Add-Type -Path scripts/ComSecurityDiagnostics.cs
      - name: Run read-only, synthetic and window smoke checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate comparison launcher with inert fixtures
        shell: powershell
        run: ./scripts/Test-ComparisonSafety.ps1
      - name: Validate RDS guest guards with inert fixtures
        shell: powershell
        run: ./scripts/Test-RdsLabGuestSafety.ps1
      - name: Validate SDK command discovery with inert fixtures
        shell: powershell
        run: ./scripts/Test-RdsLabSdkSafety.ps1
      - name: Validate public-content policy on Windows PowerShell
        shell: powershell
        run: ./scripts/Test-PublicContentSafety.ps1
      - name: Check public content through the Windows command-line entry point
        shell: powershell
        run: |
          powershell.exe -NoProfile -File ./scripts/Test-PublicContent.ps1 -History
          if ($LASTEXITCODE -ne 0) { throw 'Public-content command-line check failed.' }
