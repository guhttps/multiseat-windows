name: Experimental Windows distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Explicit full commit SHA or experimental version tag to build
        required: true
        type: string
      version:
        description: Experimental version, for example 0.1.0-experimental.1
        required: true
        default: 0.1.0-experimental.1
        type: string
      publish_draft:
        description: Create a draft prerelease for inspection; does not publish it
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*-experimental.*'

permissions:
  contents: read

concurrency:
  group: experimental-distribution-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit source and release version
        id: identity
        shell: powershell
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})-experimental\.[1-9][0-9]{0,3}$'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if (-not $env:GITHUB_REF_NAME.StartsWith('v')) { throw 'Expected an experimental tag.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = $env:REQUESTED_VERSION
            if ($env:REQUESTED_REF -notmatch '^[a-fA-F0-9]{40,64}$' -and $env:REQUESTED_REF -ne ('v' + $version)) {
              throw 'Select a full commit SHA or the exact experimental version tag.'
            }
          }
          if ($version -notmatch $pattern) { throw 'Invalid experimental version.' }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[a-f0-9]{40,64}$') { throw 'Could not identify source revision.' }
          ('version=' + $version) | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ('revision=' + $revision) | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Check public source and reachable history
        shell: powershell
        run: ./scripts/Test-PublicContent.ps1 -History
      - name: Acquire checksum-pinned, signed Inno Setup compiler
        shell: powershell
        run: ./scripts/package/Install-InnoCompiler.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'multiseat-inno-6.7.3')
      - name: Build, test and package the fixed distribution file list
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          ./scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION -IsccPath $env:MULTISEAT_ISCC -Generator 'Visual Studio 17 2022' -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/distribution')
      - name: Validate package contents and unsafe payload fixtures
        shell: powershell
        run: ./scripts/package/Test-PackageSafety.ps1 -PayloadDirectory build/distribution/payload -ArtifactDirectory build/distribution/artifacts
      - name: Install and uninstall on the isolated hosted runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem build/distribution/artifacts -File -Filter '*-installer.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one built installer.' }
          ./scripts/package/Test-Installer.ps1 -InstallerPath $installers[0].FullName -Directory (Join-Path $env:RUNNER_TEMP 'multiseat-installer-integration')
      - name: Upload installer, portable package and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MultiseatPrototype-${{ steps.identity.outputs.version }}-windows-x64
          path: |
            build/distribution/artifacts/*-installer.exe
            build/distribution/artifacts/*-windows-x64.zip
            build/distribution/artifacts/SHA256SUMS.txt
            build/distribution/artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MultiseatPrototype-${{ needs.build.outputs.version }}-windows-x64
          path: build/release-download
          digest-mismatch: error
      - name: Verify artifacts and create a draft prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'build/release-download'
          $allowed = @(('MultiseatPrototype-' + $env:RELEASE_VERSION + '-windows-x64-installer.exe'), ('MultiseatPrototype-' + $env:RELEASE_VERSION + '-windows-x64.zip'), 'release-manifest.json', 'SHA256SUMS.txt')
          $items = @(Get-ChildItem -LiteralPath $root -File -Force)
          if ($items.Count -ne $allowed.Count -or @($items | Where-Object Name -NotIn $allowed).Count) { throw 'Unexpected release artifact list.' }
          $lines = @(Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt'))
          if ($lines.Count -ne 3) { throw 'Unexpected release checksum list.' }
          $seen = @{}
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-fA-F0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum line.' }
            $hash, $name = $Matches[1], $Matches[2]
            if ($name -notin $allowed -or $name -eq 'SHA256SUMS.txt' -or $seen.ContainsKey($name)) { throw 'Unexpected checksum filename.' }
            $seen[$name] = $true
            if ((Get-FileHash -LiteralPath (Join-Path $root $name) -Algorithm SHA256).Hash -ne $hash) { throw 'Release artifact hash mismatch.' }
          }
          $assets = @($items | Sort-Object Name | ForEach-Object FullName)
          gh release create ('v' + $env:RELEASE_VERSION) --target $env:SOURCE_REVISION --draft --prerelease --title ('Multiseat Windows Prototype ' + $env:RELEASE_VERSION) --notes-file installer/RELEASE-NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft prerelease creation failed.' }
